name: AskMe Android APK

on:
  push:
    branches:
      - main
      - feature/offline-ai-voice
  workflow_dispatch:

jobs:
  build:
    name: Test and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android NDK for NativeAOT
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Publish C# Android NativeAOT host
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          dotnet publish DotNetBackend/AskMe.AndroidHost/AskMe.AndroidHost.csproj \
            --configuration Release \
            --runtime linux-bionic-arm64 \
            -p:DisableUnsupportedError=true \
            -p:PublishAotUsingRuntimePack=true
          mkdir -p FlutterApp/android/app/src/main/jniLibs/arm64-v8a
          PUBLISH_DIR="DotNetBackend/AskMe.AndroidHost/bin/Release/net10.0/linux-bionic-arm64/publish"
          echo "NativeAOT publish output:"
          find "$PUBLISH_DIR" -maxdepth 2 -type f -printf '%f (%s bytes)\\n' | sort
          HOST_LIBRARY="$(find "$PUBLISH_DIR" -maxdepth 2 -type f -name '*.so' -print -quit)"
          if [ -z "$HOST_LIBRARY" ]; then
            echo "::error::NativeAOT publish completed but no shared-library (.so) was found in $PUBLISH_DIR."
            exit 1
          fi
          echo "Using NativeAOT library: $HOST_LIBRARY"
          cp -vf "$HOST_LIBRARY" FlutterApp/android/app/src/main/jniLibs/arm64-v8a/libaskme_android_host.so
          ls -la FlutterApp/android/app/src/main/jniLibs/arm64-v8a/

      - name: Run Backend Tests
        run: dotnet test DotNetBackend/AskMe.Core.Tests/AskMe.Core.Tests.csproj

      - name: Get Flutter Dependencies
        working-directory: FlutterApp
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: FlutterApp
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        working-directory: FlutterApp
        run: flutter test

      - name: Build Android APK
        working-directory: FlutterApp
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          SO_FILE=$(find ../DotNetBackend/AskMe.AndroidHost/bin/Release/net10.0/linux-bionic-arm64/publish -maxdepth 2 -type f -name "*.so" -print -quit)
          echo "NativeAOT host library location: $SO_FILE"
          if [ -n "$SO_FILE" ]; then
            cp -vf "$SO_FILE" android/app/src/main/jniLibs/arm64-v8a/libaskme_android_host.so
          fi
          echo "Verifying jniLibs before APK build:"
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          test -s android/app/src/main/jniLibs/arm64-v8a/libaskme_android_host.so
          flutter build apk --release --target-platform android-arm64
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AskMe-Android-APK
          path: FlutterApp/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
